# Trida AI Blueprint — Support Ticket Triage Agent
#
# The production topology, runnable locally: the API is a stateless
# container; ALL state lives in PostgreSQL (triage records, LangGraph
# checkpoints, pgvector embeddings) and the S3 bucket (raw ticket
# payloads) — the same shape a cloud deployment takes.
#
#   docker compose up --build
#   curl localhost:8000/health
#   open http://localhost:8000 for the console
#
# The API applies the SQL migrations in ./migrations on startup, so
# first boot needs no manual schema step. The bucket is created by the
# `bucket-init` one-shot (and re-checked by the API at startup).
#
# Decision backend: offline by default (deterministic rules, no keys).
# Create a .env next to this file (see .env.example) and set
# DECISION_BACKEND=jev / =llm (or a provider alias) — the pass-through
# variables below forward it into the container.

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://triage:triage@postgres:5432/triage
      S3_BUCKET: ticket-payloads
      S3_ENDPOINT_URL: http://minio:8333
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_REGION: us-east-1
      # Pass-through from the host environment / .env (empty = unset,
      # so the in-image offline defaults hold).
      DECISION_BACKEND: ${DECISION_BACKEND:-}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      TYPESAFE_BASE_URL: ${TYPESAFE_BASE_URL:-}
      TYPESAFE_MODEL: ${TYPESAFE_MODEL:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      EMBEDDER: ${EMBEDDER:-}
      API_KEY: ${API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      bucket-init:
        condition: service_completed_successfully

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: triage
      POSTGRES_PASSWORD: triage
      POSTGRES_DB: triage
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # pg_isready returns 0 before the server accepts the app role;
      # an actual query makes "healthy" mean "the API can connect".
      test: ["CMD-SHELL", "psql -U triage -d triage -tAc 'SELECT 1' >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 20

  # S3-compatible object storage. SeaweedFS's S3 gateway serves the
  # `minio` hostname the API config points at (S3_ENDPOINT_URL above);
  # the production shape only depends on the S3 API, not the vendor.
  minio:
    image: chrislusf/seaweedfs:latest
    command: server -s3 -dir=/data -ip=0.0.0.0
    volumes:
      - s3data:/data
    healthcheck:
      # SeaweedFS's image is minimal (no curl): probe the S3 port with wget.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8333/"]
      interval: 3s
      timeout: 3s
      retries: 20

  bucket-init:
    image: curlimages/curl:latest
    depends_on:
      minio:
        condition: service_healthy
    # Create the bucket with a plain unsigned PUT: SeaweedFS's S3
    # gateway accepts bucket creation unauthenticated in this local
    # topology; against authenticated S3 the API's own signed
    # ensure-bucket at startup does the same job.
    entrypoint: ["sh", "-c", "curl -sf -X PUT http://minio:8333/ticket-payloads || true"]

  # Optional local model server for DECISION_BACKEND=ollama
  # (start with: docker compose --profile ollama up).
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    volumes:
      - ollamadata:/root/.ollama

volumes:
  pgdata:
  s3data:
  ollamadata:
